name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the web app with the Capacitor base path and copies it into
      # android/app/src/main/assets/public.
      - name: Build web assets and sync into the Android project
        run: npm run cap:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle auto-generates a fresh, random debug signing key on any machine
      # where ~/.android/debug.keystore doesn't exist yet — on ephemeral CI
      # runners that means a *different* key every run, so Android refuses to
      # install a new APK over the last one ("signatures do not match"). This
      # keystore is committed once and reused on every run so builds keep the
      # same signature and install as in-place updates. It's the well-known
      # standard debug keystore (password "android") — never used for a
      # release/Play Store build, so there's nothing sensitive in it.
      - name: Restore or create the persistent debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f android/ci-debug.keystore ]; then
            cp android/ci-debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore android/ci-debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/ci-debug.keystore
            git commit -m "Add persistent CI debug keystore for consistent APK signing"
            git push
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
