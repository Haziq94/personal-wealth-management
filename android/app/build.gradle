apply plugin: 'com.android.application'

android {
    namespace = "com.haziq.wealth"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.haziq.wealth"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes an ever-increasing number so each build installs as an
        // upgrade over the last; local builds fall back to 1.
        versionCode System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Explicit, so debug builds always sign with the checked-in keystore
    // (../ci-debug.keystore) instead of Android Gradle Plugin's implicit
    // debug-keystore lookup — that lookup's location isn't guaranteed to be
    // ~/.android/debug.keystore on every environment (e.g. it can follow
    // ANDROID_USER_HOME/ANDROID_SDK_HOME), so silently relying on it let CI
    // regenerate a fresh throwaway key on every run despite restoring the
    // same file there — every build looked identical in the logs but was
    // actually signed with a different key each time, so no CI-built APK
    // could ever install as an update over the last one.
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/ci-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Supplied by CI from repository secrets. A release key can't be
        // committed the way the debug one is — this repo is public — so when
        // the env isn't set (any local build) the release APK comes out
        // unsigned rather than falling back to some checked-in key.
        release {
            if (System.getenv("RELEASE_KEYSTORE_PATH")) {
                storeFile file(System.getenv("RELEASE_KEYSTORE_PATH"))
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Play Protect weighs a debuggable, debug-signed APK heavily when
            // scoring an unknown-publisher app — doubly so for one that asks
            // for notification access. A proper release build drops both flags.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("RELEASE_KEYSTORE_PATH") ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
